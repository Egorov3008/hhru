[alembic]
script_location = migrations
prepend_sys_path = .
# URL пробрасывается из HHSH_DB__URL через env.py; здесь — только дефолт для CLI-оффлайна
sqlalchemy.url = sqlite+aiosqlite:///./runtime/hh-smart-hunter.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S