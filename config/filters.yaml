# ============================================================
# Поисковые запросы и правила фильтрации.
# Заполняется под себя: каждая запись из searches -> один
# периодический опрос hh.ru через x-cli.
# ============================================================

searches:
  - name: python-backend
    query: "Python backend разработчик"
    area_id: "1"                      # Москва (113 = вся Россия, 2 = СПб)
    experience: "between1And3"        # noExperience | between1And3 | between3And6 | moreThan6
    employment: "full"                # full | part | project
    exclude_words: ["1С", "Bitrix", "Битрикс", "Директор"]

  - name: ai-automation
    query: "AI LLM автоматизация разработка"
    area_id: "1"
    exclude_words: ["продавец", "оператор Call-центра"]

# ---------- Жёсткие лимиты ДО LLM (мгновенный отсев, экономим токены) ----------
limits:
  # Не рассматриваем вакансии старше N дней (поднятые заново всё же вернутся в выдачу)
  max_age_days: 14
  # Минимальная зарплата. null в amount = без ограничения
  min_salary:
    amount: 250_000
    currency: "RUR"
  # Ключевые слова в названии/описании -> skip без скоринга
  hard_reject_keywords:
    - "1С:Предприятие"
    - "Bitrix24"
    - "холодные звонки"
    - "% от сделки"
  # Подстроки в названии компании -> skip без скоринга
  # (вакансий таких работодателей не будет в Telegram)
  employer_name_blacklist:
    - "Ростелеком-ЦОД"
    - "ООО Инфо-Компас"

# ---------- Правила для LLM-скоринга (семантический слой) ----------
scoring:
  score_threshold: 7        # ниже — не присылаем карточку
  # Что считается красным флагом (LLM использует как ориентир, может добавить свои):
  red_flag_hints:
    - "оформление только как самозанятый/ИП"
    - "скрытый офис или полигон перед трудоустройством"
    - "устаревший стек при заявлении о современном продукте"
    - "неоплачиваемое тестовое большого объёма"
    - "требования к языкам, которых нет в описании продукта (алюминиевые 'вилки' навыков)"
  # Направления, которые считаем профильными (повышают скор)
  target_domains:
    - "backend на Python (asyncio, FastAPI, Django, aiohttp)"
    - "инфраструктура и автоматизация (CI/CD, Docker, k8s)"
    - "LLM/AI-интеграции, пайплайны RAG и агентов"
    - "Telegram-боты и бэкенд мессенджеров"

# ---------- Автоподнятие резюме ----------
boost:
  enabled: true
  interval_minutes: 240     # каждые 4 часа
  # Лимиты hh.ru на подъем — соблюдаем консервативно
  max_boosts_per_day_per_resume: 6
  # hh_resume_id указываются после первого запуска команды списка резюме
  resume_ids: []